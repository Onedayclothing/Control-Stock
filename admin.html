<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Oneday Clothing | Stock Admin Controller</title>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background: #0f172a; color: #f8fafc; font-family: 'Kantumruy Pro', sans-serif; padding: 15px; margin: 0; }
        h1 { font-size: 18px; text-align: center; margin-bottom: 15px; color: #38bdf8; }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .info { font-size: 13px; font-weight: 700; }
        .sub { font-size: 11px; color: #94a3b8; }
        .controls { display: flex; align-items: center; gap: 8px; }
        button { background: #0284c7; color: white; border: none; width: 32px; height: 32px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 14px; }
        input { width: 50px; text-align: center; background: #0f172a; color: white; border: 1px solid #334155; border-radius: 6px; padding: 6px; font-weight: bold; font-size: 14px; }
        .loading { text-align: center; color: #94a3b8; margin-top: 30px; font-size: 13px; }
    </style>
</head>
<body>
    <h1>📦 Oneday Stock Controller</h1>
    <div id="stockList" class="loading">កំពុងទាញយកទិន្នន័យស្តុក...</div>

    <script>
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.expand();
        }

        async function loadStock() {
            try {
                let res = await fetch('/api/stock');
                let data = await res.json();
                let html = '';

                data.forEach(item => {
                    html += `
                        <div class="card">
                            <div>
                                <div class="info">Ref: ${item.ref} — Size: ${item.size}</div>
                                <div class="sub">តម្លៃ: $${parseFloat(item.price).toFixed(2)}</div>
                            </div>
                            <div class="controls">
                                <button onclick="updateQty('${item.ref}', '${item.size}', ${item.stock_qty - 1})">-</button>
                                <input type="number" id="qty-${item.ref}-${item.size}" value="${item.stock_qty}" onchange="updateQty('${item.ref}', '${item.size}', this.value)">
                                <button onclick="updateQty('${item.ref}', '${item.size}', ${item.stock_qty + 1})">+</button>
                            </div>
                        </div>
                    `;
                });
                document.getElementById('stockList').innerHTML = html;
            } catch (err) {
                document.getElementById('stockList').innerHTML = "เกิดข้อผิดพลาดในการโหลดข้อมูล";
            }
        }

        async function updateQty(ref, size, newQty) {
            newQty = parseInt(newQty);
            if (isNaN(newQty) || newQty < 0) return;

            let res = await fetch('/api/admin/update-stock', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ ref, size, qty: newQty })
            });
            let result = await res.json();
            if (!result.success) {
                alert("មិនអាចកែប្រែស្តុកបានទេ!");
            }
            loadStock();
        }

        loadStock();
    </script>
</body>
</html>
