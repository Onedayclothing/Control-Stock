<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OneDay Admin - Stock Manager</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-900 text-white p-4">
    <div class="max-w-md mx-auto">
        <h1 class="text-2xl font-bold mb-4 text-center">📂 Admin Stock Control</h1>
        <div id="product-list" class="space-y-4">
            <p class="text-center text-gray-400">កំពុងទាញយកទិន្នន័យ...</p>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        async function loadStock() {
            try {
                let res = await fetch('/api/products');
                let products = await res.json();
                let container = document.getElementById('product-list');
                container.innerHTML = '';

                products.forEach(p => {
                    let sizesHtml = '';
                    if (p.sizes) {
                        p.sizes.forEach(s => {
                            sizesHtml += `
                                <div class="flex justify-between items-center bg-gray-800 p-2 rounded mb-1">
                                    <span>Size: <b>${s.size}</b> (សល់: ${s.stock_qty})</span>
                                    <div class="flex gap-2">
                                        <input type="number" id="qty-${p.ref}-${s.size}" value="${s.stock_qty}" class="w-16 bg-gray-700 text-center rounded p-1">
                                        <button onclick="updateStock('${p.ref}', '${s.size}')" class="bg-blue-600 px-3 py-1 rounded text-sm font-semibold">កែប្រែ</button>
                                    </div>
                                </div>
                            `;
                        });
                    }

                    container.innerHTML += `
                        <div class="bg-gray-800 p-3 rounded-lg shadow border border-gray-700">
                            <h3 class="font-bold text-lg text-yellow-400">Ref: ${p.ref} - ${p.title_km}</h3>
                            <p class="text-sm text-gray-400 mb-2">តម្លៃ: $${p.price}</p>
                            <div class="mt-2">${sizesHtml}</div>
                        </div>
                    `;
                });
            } catch (err) {
                console.error(err);
            }
        }

        async function updateStock(ref, size) {
            let qty = document.getElementById(`qty-${ref}-${size}`).value;
            try {
                let res = await fetch('/api/admin/update-stock', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ref, size, qty: parseInt(qty) })
                });
                let data = await res.json();
                if (data.success) {
                    alert('✅ អាប់ដេតស្តុកបានជោគជ័យ!');
                    loadStock();
                } else {
                    alert('❌ បរាជ័យ: ' + data.error);
                }
            } catch (err) {
                alert('❌ កំហុសបច្ចេកទេស: ' + err.message);
            }
        }

        loadStock();
    </script>
</body>
</html>
