<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Oneday Clothing | Stock Admin Controller</title>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background: #0f172a; color: #f8fafc; font-family: 'Kantumruy Pro', sans-serif; padding: 15px; margin: 0; }
        h1 { font-size: 18px; text-align: center; margin-bottom: 12px; color: #38bdf8; }
        
        /* Search Bar Style */
        .search-box { margin-bottom: 15px; }
        .search-input { width: 100%; padding: 10px 14px; background: #1e293b; border: 1px solid #334155; border-radius: 10px; color: white; font-size: 14px; outline: none; font-family: 'Kantumruy Pro', sans-serif; box-sizing: border-box; }
        .search-input:focus { border-color: #0284c7; }

        .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 12px; margin-bottom: 12px; }
        
        /* Product Title Line */
        .prod-title-line { font-size: 13px; font-weight: 700; color: #f8fafc; margin-bottom: 10px; border-bottom: 1px solid #334155; padding-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        .prod-price { font-size: 13px; color: #38bdf8; font-weight: 800; }
        
        /* Size Vertical List Style */
        .size-list { display: flex; flex-direction: column; gap: 6px; }
        .size-row-item { display: flex; justify-content: space-between; align-items: center; background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 6px 12px; }
        .size-label { font-size: 12px; font-weight: bold; color: #94a3b8; }
        .controls { display: flex; align-items: center; gap: 6px; }
        button.qty-btn { background: #0284c7; color: white; border: none; width: 30px; height: 30px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center; }
        input.qty-input { width: 50px; text-align: center; background: #1e293b; color: white; border: 1px solid #334155; border-radius: 6px; padding: 5px; font-weight: bold; font-size: 13px; }
        
        .loading { text-align: center; color: #94a3b8; margin-top: 30px; font-size: 13px; }
    </style>
</head>
<body>
    <h1>📦 Oneday Stock Controller</h1>
    
    <!-- Search Bar -->
    <div class="search-box">
        <input type="text" id="searchInput" class="search-input" placeholder="🔍 ស្វែងរកតាមឈ្មោះ ឬ Ref (ឧ. 1, Polo...)" oninput="filterStockList()">
    </div>

    <div id="stockList" class="loading">កំពុងទាញយកទិន្នន័យទំនិញ...</div>

    <script>
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.expand();
        }

        let productsData = [];

        async function loadStock() {
            try {
                let res = await fetch('/api/products');
                productsData = await res.json();
                renderProducts(productsData);
            } catch (err) {
                document.getElementById('stockList').innerHTML = "កើតមានកំហុសក្នុងការផ្ទុកទិន្នន័យ";
            }
        }

        function renderProducts(dataToRender) {
            let html = '';
            
            if (dataToRender.length === 0) {
                document.getElementById('stockList').innerHTML = `<div style="text-align: center; color: #94a3b8; margin-top: 20px;">រកមិនឃើញទំនិញដែលអ្នកស្វែងរក!</div>`;
                return;
            }

            dataToRender.forEach(prod => {
                let ref = prod.ref;
                let sizesHtml = '';
                
                // បង្ហាញ Size នីមួយៗជាជួរដេកចុះក្រោម (Vertical lines)
                ['S', 'M', 'L', 'XL', 'XXL'].forEach(sz => {
                    let sizeData = prod.sizes.find(s => s.size.toUpperCase() === sz) || { stock_qty: 0 };
                    let qty = sizeData.stock_qty;

                    sizesHtml += `
                        <div class="size-row-item">
                            <span class="size-label">Size: ${sz}</span>
                            <div class="controls">
                                <button class="qty-btn" onclick="updateQty('${ref}', '${sz}', ${qty - 1})">-</button>
                                <input type="number" class="qty-input" value="${qty}" onchange="updateQty('${ref}', '${sz}', this.value)">
                                <button class="qty-btn" onclick="updateQty('${ref}', '${sz}', ${qty + 1})">+</button>
                            </div>
                        </div>
                    `;
                });

                html += `
                    <div class="card">
                        <div class="prod-title-line">
                            <span>Ref: ${ref} - ${prod.title_km}</span>
                            <span class="prod-price">$${parseFloat(prod.price).toFixed(2)}</span>
                        </div>
                        <div class="size-list">
                            ${sizesHtml}
                        </div>
                    </div>
                `;
            });
            document.getElementById('stockList').innerHTML = html;
        }

        function filterStockList() {
            let keyword = document.getElementById('searchInput').value.toLowerCase().trim();
            let filtered = productsData.filter(prod => {
                let title = prod.title_km.toLowerCase();
                let ref = String(prod.ref).toLowerCase();
                return title.includes(keyword) || ref.includes(keyword);
            });
            renderProducts(filtered);
        }

        async function updateQty(ref, size, newQty) {
            newQty = parseInt(newQty);
            if (isNaN(newQty) || newQty < 0) return;

            let res = await fetch('/api/admin/update-stock', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ ref, size, qty: newQty })
            });
            let result = await res.json();
            if (!result.success) {
                alert("មិនអាចកែប្រែស្តុកបានទេ!");
            } else {
                let resProd = await fetch('/api/products');
                productsData = await resProd.json();
                filterStockList();
            }
        }

        loadStock();
    </script>
</body>
</html>
